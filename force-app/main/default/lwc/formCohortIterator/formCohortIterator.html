<template>
    <div class="cohort-iterator">
        <!-- Cohort header with name and progress -->
        <div class="cohort-header">
            <div class="cohort-pill">{cohortName}</div>
            <template if:true={showCohortProgress}>
                <div class="cohort-progress-text">
                    Cohort {currentCohortNumber} of {totalCohorts}
                </div>
            </template>
        </div>

        <!-- ========== Page 1: Inclusion / Exclusion ========== -->
        <template if:true={isPage1}>

            <div class="page-header">
                <h2 class="page-title">Inclusion/Exclusion Criteria</h2>
                <p class="page-subtitle">Specify requirements for this cohort</p>
            </div>

            <!-- Number of Donors Required -->
            <div class="card">
                <h3 class="card-title">Study Details</h3>
                <div class="field-group">
                    <c-dynamic-input
                        name="num_donors"
                        label="Number of Donors Required"
                        type="number"
                        min="1"
                        placeholder="e.g., 25"
                        required="true"
                        show-label="true"
                        state={cohortScopedState}
                        onvaluechange2={handleDynamicInputChange}
                        data-question="num_donors">
                    </c-dynamic-input>
                </div>
            </div>

            <div class="card">
                <h3 class="card-title">Inclusion Criteria</h3>

                <div class="field-group">
                    <c-dynamic-input
                        name="incl_diag"
                        label="Diagnosis Criteria"
                        type="textarea"
                        rows="3"
                        show-label="true"
                        state={cohortScopedState}
                        onvaluechange2={handleDynamicInputChange}
                        data-question="incl_diag">
                    </c-dynamic-input>
                </div>

                <div class="field-group">
                    <c-dynamic-input
                        name="incl_med"
                        label="Medications/Treatments Criteria"
                        type="textarea"
                        rows="3"
                        show-label="true"
                        state={cohortScopedState}
                        onvaluechange2={handleDynamicInputChange}
                        data-question="incl_med">
                    </c-dynamic-input>
                </div>

                <div class="field-group">
                    <c-dynamic-input
                        name="incl_other"
                        label="Other Criteria"
                        type="textarea"
                        rows="3"
                        show-label="true"
                        state={cohortScopedState}
                        onvaluechange2={handleDynamicInputChange}
                        data-question="incl_other">
                    </c-dynamic-input>
                </div>
            </div>

            <div class="card">
                <h3 class="card-title">Exclusion Criteria</h3>

                <div class="field-group">
                    <c-dynamic-input
                        name="excl_diag"
                        label="Diagnosis Criteria"
                        type="textarea"
                        rows="3"
                        show-label="true"
                        state={cohortScopedState}
                        onvaluechange2={handleDynamicInputChange}
                        data-question="excl_diag">
                    </c-dynamic-input>
                </div>

                <div class="field-group">
                    <c-dynamic-input
                        name="excl_med"
                        label="Medications/Treatments Criteria"
                        type="textarea"
                        rows="3"
                        show-label="true"
                        state={cohortScopedState}
                        onvaluechange2={handleDynamicInputChange}
                        data-question="excl_med">
                    </c-dynamic-input>
                </div>

                <div class="field-group">
                    <c-dynamic-input
                        name="excl_other"
                        label="Other Criteria"
                        type="textarea"
                        rows="3"
                        show-label="true"
                        state={cohortScopedState}
                        onvaluechange2={handleDynamicInputChange}
                        data-question="excl_other">
                    </c-dynamic-input>
                </div>
            </div>
        </template>

        <!-- ========== Page 2: Leukopak Configuration ========== -->
        <template if:true={isPage2Leukopak}>
            <div class="page-header">
                <h2 class="page-title">Leukopak Information</h2>
                <p class="page-subtitle">Configure your leukopak requirements and select any additional biospecimen types needed</p>
            </div>

            <!-- Copy Configuration Feature -->
            <template if:true={showCopyConfiguration}>
                <div class="copy-config-container">
                    <h3 class="copy-config-title">Copy Biospecimen Configuration</h3>
                    <p class="copy-config-subtitle">
                        Save time by copying biospecimen types and configurations from a previous cohort with the same workflow type (Leukopak).
                    </p>
                    
                    <div class="copy-config-controls">
                        <div class="copy-config-field">
                            <label class="copy-config-label">Copy from Cohort</label>
                            <select 
                                class="copy-config-select" 
                                onchange={handleCohortSelectionForCopy}>
                                <option value="">Select cohort...</option>
                                <template for:each={availableCohortsForCopy} for:item="cohort">
                                    <option key={cohort.value} value={cohort.value}>{cohort.label}</option>
                                </template>
                            </select>
                        </div>
                        
                        <button 
                            class="copy-config-button"
                            disabled={isCopyButtonDisabled}
                            onclick={handleCopyConfiguration}>
                            Copy Configuration
                        </button>
                        
                        <p class="copy-config-help">
                            This will copy all selected biospecimen types and their detailed configurations from the selected cohort.
                        </p>
                    </div>
                </div>
            </template>

            <div class="card">
                <h3 class="card-title">Leukopak Configuration</h3>

                <div class="field-group">
                    <c-dynamic-input
                        name="leuko_condition"
                        label="Leukopak Condition"
                        type="dropdown"
                        placeholder="Select..."
                        options={leukoConditionOptions}
                        required="true"
                        show-label="true"
                        state={cohortScopedState}
                        onvaluechange2={handleDynamicInputChange}
                        data-question="leuko_condition">
                    </c-dynamic-input>
                </div>

                <div class="field-group">
                    <label class="field-label">Required Donor Information</label>
                    <div class="checkbox-row">
                        <label class="checkbox-label">
                            <input type="checkbox" value="hla" data-question="leuko_donor_hla" checked={leukoDonorHlaChecked} onchange={handleCheckboxChange} />
                            <span>HLA Typing</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" value="medical_records" data-question="leuko_donor_medical" checked={leukoDonorMedicalChecked} onchange={handleCheckboxChange} />
                            <span>Medical Records</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" value="cell_counts" data-question="leuko_donor_counts" checked={leukoDonorCountsChecked} onchange={handleCheckboxChange} />
                            <span>Cell Counts</span>
                        </label>
                    </div>
                </div>

                <div class="fields-grid-2col">
                    <div class="field-group">
                        <c-dynamic-input
                            name="leuko_size"
                            label="Leukopak Size"
                            type="dropdown"
                            placeholder="Select..."
                            options={leukoSizeOptions}
                            required="true"
                            show-label="true"
                            state={cohortScopedState}
                            onvaluechange2={handleDynamicInputChange}
                            data-question="leuko_size">
                        </c-dynamic-input>
                    </div>

                    <div class="field-group">
                        <c-dynamic-input
                            name="leuko_quantity"
                            label="Leukopak Quantity"
                            type="number"
                            min="1"
                            placeholder="e.g., 5"
                            required="true"
                            show-label="true"
                            state={cohortScopedState}
                            onvaluechange2={handleDynamicInputChange}
                            data-question="leuko_quantity">
                        </c-dynamic-input>
                    </div>

                    <div class="field-group">
                        <c-dynamic-input
                            name="leuko_type"
                            label="Leukopak Type"
                            type="dropdown"
                            placeholder="Select..."
                            options={leukoTypeOptions}
                            required="true"
                            show-label="true"
                            state={cohortScopedState}
                            onvaluechange2={handleDynamicInputChange}
                            data-question="leuko_type">
                        </c-dynamic-input>
                    </div>

                    <div class="field-group">
                        <c-dynamic-input
                            name="leuko_usage"
                            label="Usage of Leukopak"
                            type="textarea"
                            rows="3"
                            placeholder="Describe intended use"
                            show-label="true"
                            state={cohortScopedState}
                            onvaluechange2={handleDynamicInputChange}
                            data-question="leuko_usage">
                        </c-dynamic-input>
                    </div>
                </div>

                <!-- Further Processing Checkbox -->
                <div class="field-group further-processing-checkbox">
                    <label class="checkbox-label">
                        <input type="checkbox" data-question="leuko_further_processing" checked={leukoFurtherProcessingChecked} onchange={handleCheckboxChange} />
                        <span>Would you like further processing of the leukopak?</span>
                    </label>
                </div>
            </div>

            <!-- Processing Section (conditionally shown) -->
            <template if:true={showProcessingSection}>
                <div class="card">
                    <h3 class="card-title">Processing</h3>

                    <div class="field-group">
                        <label class="field-label">Leukopak Cell Isolation Type *</label>
                        <select class="select-input" data-question="leuko_isolation_type" onchange={handleIsolationTypeChange}>
                            <option value="">Select...</option>
                            <option value="PBMC">PBMC</option>
                            <option value="T-Cell">T-Cell</option>
                            <option value="B-Cell">B-Cell</option>
                            <option value="NK-Cell">NK-Cell</option>
                        </select>
                    </div>

                    <template if:true={showAliquotSizeField}>
                        <div class="field-group">
                            <label class="field-label">Isolated Cell Aliquot Size *</label>
                            <select class="select-input" data-question="leuko_aliquot" onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <template for:each={aliquotSizeOptions} for:item="option">
                                    <option key={option.value} value={option.value}>{option.label}</option>
                                </template>
                            </select>
                        </div>

                        <!-- Conditional Custom Aliquot Size Field -->
                        <template if:true={showLeukoAliquotCustom}>
                            <div class="field-group">
                                <label class="field-label">Custom Aliquot Size *</label>
                                <input
                                    type="text"
                                    class="text-input"
                                    maxlength="255"
                                    placeholder="Specify custom aliquot size"
                                    data-question="leuko_aliquot_custom"
                                    oninput={handleFieldInput}
                                    value={leukoAliquotCustomValue} />
                            </div>
                        </template>
                    </template>
                </div>
            </template>

            <div class="card">
                <h3 class="card-title">Additional Biospecimen Type(s)</h3>
                <p class="card-subtitle">
                    If you would like additional biospecimens to be collected during the leukopak collection, please select from the products below:
                </p>

                <div class="biospecimen-section">
                    <h4 class="section-heading">Whole Blood Products</h4>
                    <div class="checkbox-grid">
                        <label class="checkbox-option">
                            <input type="checkbox" value="wholeBlood" data-question="leuko_add_wholeBlood" checked={leukoAddWholeBloodChecked} onchange={handleCheckboxChange} />
                            <span>Whole Blood</span>
                        </label>
                    </div>
                </div>

                <div class="biospecimen-section">
                    <h4 class="section-heading">Processed Blood Products</h4>
                    <div class="checkbox-grid checkbox-grid-4col">
                        <label class="checkbox-option">
                            <input type="checkbox" value="pbmc" data-question="leuko_add_pbmc" checked={leukoAddPBMCChecked} onchange={handleCheckboxChange} />
                            <span>PBMC</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" value="plasma" data-question="leuko_add_plasma" checked={leukoAddPlasmaChecked} onchange={handleCheckboxChange} />
                            <span>Plasma</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" value="serum" data-question="leuko_add_serum" checked={leukoAddSerumChecked} onchange={handleCheckboxChange} />
                            <span>Serum</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" value="bulkPlasma" data-question="leuko_add_bulkPlasma" checked={leukoAddBulkPlasmaChecked} onchange={handleCheckboxChange} />
                            <span>Bulk Plasma</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Conditional Whole Blood Card -->
            <template if:true={showWholeBloodCardLeukopak}>
                <div class="card">
                    <h3 class="card-title">Whole Blood</h3>
                    
                    <div class="fields-grid-2col">
                        <div class="field-group">
                            <label class="field-label">Whole Blood Collection Materials *</label>
                            <select 
                                class="select-input" 
                                data-question="wholeBlood_collection_materials" 
                                onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <option value="ACD">ACD</option>
                                <option value="CPT Sodium Citrate">CPT Sodium Citrate</option>
                                <option value="CPT Sodium Heparin">CPT Sodium Heparin</option>
                                <option value="EDTA">EDTA</option>
                                <option value="Lithium Heparin">Lithium Heparin</option>
                                <option value="Sodium Citrate">Sodium Citrate</option>
                                <option value="Sodium Heparin">Sodium Heparin</option>
                                <option value="SST">SST</option>
                                <option value="Custom Blood Materials">Custom Blood Materials</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label class="field-label">Whole Blood Volume (mL) *</label>
                            <input
                                type="number"
                                class="text-input"
                                min="1"
                                max="60"
                                data-question="wholeBlood_volume"
                                oninput={handleWholeBloodVolumeInput}
                                value={wholeBloodVolumeValue} />
                            <p class="field-help-text">Maximum 60mL when additional biospecimen is selected</p>
                        </div>

                        <div class="field-group">
                            <label class="field-label">Whole Blood Temperature Options *</label>
                            <select
                                class="select-input"
                                data-question="wholeBlood_temperature"
                                onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <option value="Ambient">Ambient</option>
                                <option value="Refrigerated">Refrigerated</option>
                                <option value="Frozen (Dry Ice)">Frozen (Dry Ice)</option>
                            </select>
                        </div>

                        <!-- Conditional Custom Blood Materials Field (Leukopak) -->
                        <template if:true={showWholeBloodCustomMaterials}>
                            <div class="field-group">
                                <label class="field-label">Custom Blood Materials *</label>
                                <input
                                    type="text"
                                    class="text-input"
                                    maxlength="255"
                                    placeholder="Specify custom material"
                                    data-question="wholeBlood_custom_materials"
                                    oninput={handleFieldInput}
                                    value={wholeBloodCustomMaterialsValue} />
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Conditional PBMC Card -->
            <template if:true={showPBMCCardLeukopak}>
                <div class="card">
                    <h3 class="card-title">PBMC</h3>

                    <div class="fields-grid-2col">
                        <div class="field-group">
                            <label class="field-label">PBMC Collection Materials *</label>
                            <select
                                class="select-input"
                                data-question="pbmc_collection_materials"
                                onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <option value="ACD">ACD</option>
                                <option value="EDTA">EDTA</option>
                                <option value="CPT Sodium Citrate">CPT Sodium Citrate</option>
                                <option value="CPT Sodium Heparin">CPT Sodium Heparin</option>
                                <option value="Lithium Heparin">Lithium Heparin</option>
                                <option value="Sodium Heparin">Sodium Heparin</option>
                                <option value="Custom PBMC Material">Custom PBMC Material</option>
                            </select>
                        </div>

                        <!-- Conditional Custom PBMC Material Field (Leukopak) -->
                        <template if:true={showPBMCCustomMaterial}>
                            <div class="field-group">
                                <label class="field-label">Custom PBMC Materials *</label>
                                <input
                                    type="text"
                                    class="text-input"
                                    maxlength="255"
                                    placeholder="Specify custom PBMC materials"
                                    data-question="pbmc_custom_materials"
                                    oninput={handleFieldInput}
                                    value={pbmcCustomMaterialsValue} />
                            </div>
                        </template>

                        <div class="field-group">
                            <label class="field-label">PBMC Blood Volume (mL) *</label>
                            <input 
                                type="number" 
                                class="text-input" 
                                min="1"
                                data-question="pbmc_volume" 
                                oninput={handleFieldInput}
                                value={pbmcVolumeValue} />
                        </div>

                        <div class="field-group">
                            <label class="field-label">PBMC Aliquot Size *</label>
                            <select
                                class="select-input"
                                data-question="pbmc_aliquot_size"
                                onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <option value="5M_Cells">5M Cells</option>
                                <option value="10M_Cells">10M Cells</option>
                                <option value="Custom PBMC Aliquot">Custom PBMC Aliquot</option>
                            </select>
                        </div>

                        <!-- Conditional Custom PBMC Aliquot Size Field (Leukopak) -->
                        <template if:true={showPBMCCustomAliquot}>
                            <div class="field-group">
                                <label class="field-label">Custom PBMC Aliquot Size *</label>
                                <input
                                    type="text"
                                    class="text-input"
                                    maxlength="255"
                                    placeholder="Specify custom aliquot size"
                                    data-question="pbmc_custom_aliquot_size"
                                    oninput={handleFieldInput}
                                    value={pbmcCustomAliquotValue} />
                            </div>
                        </template>

                        <div class="field-group">
                            <label class="field-label">PBMC Shipping Temperature *</label>
                            <select
                                class="select-input"
                                data-question="pbmc_shipping_temperature" 
                                onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <option value="Frozen (Dry Ice)">Frozen (Dry Ice)</option>
                                <option value="LN2">LN2</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label class="field-label">WB Shipment for PBMC Temp. Options</label>
                            <select 
                                class="select-input" 
                                data-question="pbmc_wb_shipment_temp" 
                                onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <option value="Ambient">Ambient</option>
                                <option value="Refrigerated">Refrigerated</option>
                            </select>
                        </div>
                    </div>
                </div>
            </template>

            

            <!-- Conditional Plasma Card -->
            <template if:true={showPlasmaCardLeukopak}>
                <div class="card">
                    <h3 class="card-title">Plasma</h3>

                    <div class="fields-grid-2col">
                        <div class="field-group">
                            <label class="field-label">Plasma Collection Materials *</label>
                            <select
                                class="select-input"
                                data-question="plasma_collection_materials"
                                onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <option value="ACD">ACD</option>
                                <option value="CPT Sodium Citrate">CPT Sodium Citrate</option>
                                <option value="CPT Sodium Heparin">CPT Sodium Heparin</option>
                                <option value="EDTA">EDTA</option>
                                <option value="Lithium Heparin">Lithium Heparin</option>
                                <option value="Sodium Citrate">Sodium Citrate</option>
                                <option value="Sodium Heparin">Sodium Heparin</option>
                                <option value="Custom Plasma Materials">Custom Plasma Materials</option>
                            </select>
                        </div>

                        <!-- Conditional Custom Plasma Materials Field -->
                        <template if:true={showPlasmaCustomMaterials}>
                            <div class="field-group">
                                <label class="field-label">Custom Plasma Materials *</label>
                                <input
                                    type="text"
                                    class="text-input"
                                    maxlength="255"
                                    placeholder="Specify custom material"
                                    data-question="plasma_custom_materials"
                                    oninput={handleFieldInput}
                                    value={plasmaCustomMaterialsValue} />
                            </div>
                        </template>

                        <div class="field-group">
                            <label class="field-label">Plasma Volume (mL) *</label>
                            <input
                                type="number"
                                class="text-input"
                                min="1"
                                data-question="plasma_volume"
                                oninput={handleFieldInput}
                                value={plasmaVolumeValue} />
                        </div>

                        <div class="field-group">
                            <label class="field-label">Plasma Aliquot Size (mL) *</label>
                            <input 
                                type="number" 
                                class="text-input" 
                                min="1"
                                data-question="plasma_aliquot_size" 
                                oninput={handleFieldInput}
                                value={plasmaAliquotSizeValue} />
                        </div>

                        <div class="field-group">
                            <label class="field-label">Plasma Temperature Options *</label>
                            <select
                                class="select-input"
                                data-question="plasma_temperature"
                                onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <option value="Ambient">Ambient</option>
                                <option value="Refrigerated">Refrigerated</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label class="field-label">Temperature of Shipping</label>
                            <select
                                class="select-input"
                                data-question="plasma_shipping_temp"
                                onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <option value="Ambient">Ambient</option>
                                <option value="Refrigerated">Refrigerated</option>
                            </select>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Conditional Serum Card -->
            <template if:true={showSerumCardLeukopak}>
                <div class="card">
                    <h3 class="card-title">Serum</h3>

                    <div class="fields-grid-2col">
                        <div class="field-group">
                            <label class="field-label">Serum Collection Materials *</label>
                            <select
                                class="select-input"
                                data-question="serum_collection_materials"
                                onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <option value="ACD">ACD</option>
                                <option value="CPT Sodium Citrate">CPT Sodium Citrate</option>
                                <option value="CPT Sodium Heparin">CPT Sodium Heparin</option>
                                <option value="EDTA">EDTA</option>
                                <option value="Lithium Heparin">Lithium Heparin</option>
                                <option value="Sodium Citrate">Sodium Citrate</option>
                                <option value="Sodium Heparin">Sodium Heparin</option>
                                <option value="SST">SST</option>
                                <option value="Custom Serum Materials">Custom Serum Materials</option>
                            </select>
                        </div>

                        <!-- Conditional Custom Serum Materials Field -->
                        <template if:true={showSerumCustomMaterials}>
                            <div class="field-group">
                                <label class="field-label">Custom Serum Materials *</label>
                                <input
                                    type="text"
                                    class="text-input"
                                    maxlength="255"
                                    placeholder="Specify custom material"
                                    data-question="serum_custom_materials"
                                    oninput={handleFieldInput}
                                    value={serumCustomMaterialsValue} />
                            </div>
                        </template>

                        <div class="field-group">
                            <label class="field-label">Serum Volume (mL) *</label>
                            <input
                                type="number"
                                class="text-input"
                                min="1"
                                data-question="serum_volume"
                                oninput={handleFieldInput}
                                value={serumVolumeValue} />
                        </div>

                        <div class="field-group">
                            <label class="field-label">Serum Aliquot Size (mL) *</label>
                            <input 
                                type="number" 
                                class="text-input" 
                                min="1"
                                data-question="serum_aliquot_size" 
                                oninput={handleFieldInput}
                                value={serumAliquotSizeValue} />
                        </div>

                        <div class="field-group">
                            <label class="field-label">Serum Temperature Options *</label>
                            <select
                                class="select-input"
                                data-question="serum_temperature"
                                onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <option value="Ambient">Ambient</option>
                                <option value="Refrigerated">Refrigerated</option>
                                <option value="Frozen (Dry Ice)">Frozen (Dry Ice)</option>
                                <option value="LN2">LN2</option>
                            </select>
                        </div>

                        <div class="field-group">
                            <label class="field-label">Temperature of Shipping</label>
                            <select
                                class="select-input"
                                data-question="serum_shipping_temp"
                                onchange={handleFieldInput}>
                                <option value="">Select...</option>
                                <option value="Ambient">Ambient</option>
                                <option value="Refrigerated">Refrigerated</option>
                            </select>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Conditional Bulk Plasma Card -->
            <template if:true={showBulkPlasmaCardLeukopak}>
                <div class="card">
                    <h3 class="card-title">Bulk Plasma</h3>
                    
                    <div class="fields-grid-2col">
                        <div class="field-group">
                            <label class="field-label">Bulk Plasma Volume (mL) *</label>
                            <select 
                                class="select-input"

        <!-- ========== Page 3: Testing & Screening ========== -->
        <template if:true={isPage3}>
            <div class="page-header">
                <h2 class="page-title">Testing & Screening</h2>
                <p class="page-subtitle">Testing requirements for this cohort</p>
            </div>

            <div class="card">
                <h3 class="card-title">Viral Screening</h3>
                <div class="radio-group-horizontal">
                    <label class="radio-card-option">
                        <input 
                            type="radio" 
                            name={viralScreeningName}
                            value="no_testing" 
                            data-question="viral_screening" 
                            onchange={handleFieldInput}
                            checked />
                        <div class="radio-card-content">
                            <div class="radio-card-title">No testing</div>
                            <div class="radio-card-subtitle">No viral screening required</div>
                        </div>
                    </label>
                    <label class="radio-card-option">
                        <input 
                            type="radio" 
                            name={viralScreeningName}
                            value="custom_testing" 
                            data-question="viral_screening" 
                            onchange={handleFieldInput} />
                        <div class="radio-card-content">
                            <div class="radio-card-title">Custom Testing</div>
                            <div class="radio-card-subtitle">Specify custom screening</div>
                        </div>
                    </label>
                </div>
                
                <!-- Conditional Custom Viral Screening Field -->
                <template if:true={isCustomTestingSelected}>
                    <div class="custom-screening-field">
                        <label class="field-label">Custom Viral Screening</label>
                        <textarea 
                            class="textarea-field"
                            data-question="custom_viral_screening" 
                            oninput={handleFieldInput}
                            placeholder="Specify viral screening requirements (e.g., HIV, HBV, HCV)"
                            rows="4">{customViralScreeningValue}</textarea>
                    </div>
                </template>
            </div>
        </template>

        <!-- ========== Shipping Assignment Page ========== -->
        <!-- Note: Timeline is now a separate shared step in the wizard, not per-cohort -->
        <template if:true={isShippingAssignmentPage}>
            <div class="page-header">
                <h2 class="page-title">Shipping Assignment</h2>
                <p class="page-subtitle">
                    Assign biospecimen types to shipping addresses
                </p>
            </div>

            <template if:true={isSingleShippingLocation}>
                <div class="card shipping-card">
                    <h3 class="card-title">Single Shipping Address</h3>
                    <p class="helper-text">
                        All biospecimen types will be shipped to your designated address.
                    </p>
                    
                    <div class="biospecimen-summary">
                        <h4 class="summary-title">Selected Biospecimens:</h4>
                        <div class="biospecimen-tags">
                            <template for:each={selectedBiospecimenLabels} for:item="label">
                                <span key={label} class="bio-tag">{label}</span>
                            </template>
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="field-label">Comments/Volume Instructions</label>
                        <textarea
                            class="textarea"
                            data-question="shipping_comments"
                            placeholder="Specify volumes or instructions"
                            oninput={handleFieldInput}></textarea>
                    </div>
                </div>
            </template>

            <template if:true={isMultipleShippingLocations}>
                <div class="info-banner">
                    <lightning-icon icon-name="utility:info" size="x-small" class="info-icon"></lightning-icon>
                    <div class="info-content">
                        <h4 class="info-title">Multiple Shipping Addresses</h4>
                        <p class="info-text">
                            Assign specific biospecimen types to different addresses
                        </p>
                    </div>
                </div>

                <template for:each={shippingAddresses} for:item="address">
                    <div key={address.key} class="card address-assignment-card">
                        <div class="address-header">
                            <h3 class="address-title">{address.title}</h3>
                            <div class="address-details">
                                <p class="address-line">{address.company}</p>
                                <p class="address-line">{address.fullName}</p>
                                <p class="address-line">{address.fullAddress}</p>
                            </div>
                        </div>

                        <div class="biospecimen-assignment">
                            <h4 class="biospecimen-title">Biospecimen Types</h4>
                            
                            <div class="biospecimen-grid">
                                <template for:each={address.availableBiospecimens} for:item="biospecimen">
                                    <label key={biospecimen.key} class={biospecimen.containerClass}>
                                        <input
                                            type="checkbox"
                                            checked={biospecimen.checked}
                                            disabled={biospecimen.disabled}
                                            data-address-index={address.index}
                                            data-biospecimen={biospecimen.value}
                                            onchange={handleBiospecimenAssignment}
                                            class="biospecimen-checkbox"
                                        />
                                        <span class="biospecimen-label">{biospecimen.label}</span>
                                    </label>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </template>
        </template>
    </div>
</template>
